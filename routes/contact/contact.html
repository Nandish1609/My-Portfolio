<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/routes/contact/contact.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
        <link rel="icon" href="/ChatGPT Image Jun 15, 2026, 04_17_27 PM.ico" />
        <title>Nandish C - Portfolio</title>
    </head>
    <body>
        <div class="header">
            <h1 id="name"><i class="fa-solid fa-terminal"></i> Portfolio</h1>
            <div class="navbar">
                <a href="/index.html">Home</a>
                <a href="/routes/about/about.html">About</a>
                <a href="/routes/skills/skills.html">Skills</a>
                <a href="/routes/projects/projects.html">Projects</a>
                <a href="/routes/contact/contact.html" class="active"
                    >Contact</a
                >
            </div>
        </div>
        <main id="main-content">
            <h1 id="contact">Contact Me</h1>
            <div class="container">
                <form action="">
                    <div class="field">
                        <label for="fname">Name</label>
                        <input
                            type="text"
                            id="fname"
                            placeholder="Name"
                            name="fname"
                        />
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Email"
                            name="email"
                        />
                    </div>
                    <div class="field">
                        <label for="msg">Message</label>
                        <textarea
                            name="msg"
                            id="msg"
                            placeholder="Message"
                        ></textarea>
                    </div>
                    <div class="field">
                        <button type="submit">Send Message</button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <hr />
            <p>Designed & Developed by Nandish Chandapur</p>
        </footer>
    </body>
</html>
